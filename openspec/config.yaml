schema: spec-driven

context: |
  Project: ComparaKeys — comparador de preços de keys de jogos.
  Domain: Sistema que permite ao usuário buscar um jogo e comparar seu preço em tempo real entre a Steam (via API pública) e lojas parceiras cadastradas (via scraping configurado por loja).
  Tech stack: Backend em Xano (XanoScript). Tech stack: Backend em Xano (XanoScript). Frontend em Reflex (Python).
  Architecture: Backend responsável por regras de negócio, autenticação e persistência. Frontend não deve ser considerado mecanismo de segurança. Preços de ofertas não são persistidos — são calculados em tempo real a cada busca.
  Security: Login obrigatório para usar o site. Papéis: usuario e admin. Apenas admin pode aprovar solicitações de loja. Autorização deve ser verificada no backend.
  Scope: MVP trabalha apenas com moeda BRL; conversão multi-moeda fica para uma fase futura.
  Development: O projeto será desenvolvido incrementalmente utilizando OpenSpec. Mudanças relevantes devem ser especificadas antes da implementação.
  Language: Escrever a documentação do projeto e os artefatos OpenSpec em português brasileiro.

rules:
  proposal:
    - Descrever claramente o problema, objetivo e escopo.
    - Identificar o que está fora do escopo quando necessário.
  specs:
    - Escrever requisitos verificáveis.
    - Utilizar cenários para comportamentos relevantes.
  tasks:
    - Dividir a implementação em tarefas pequenas e verificáveis.

operations:
  apply:
    guidance:
      - Executar verificações relevantes antes de concluir (ex.: validar XanoScript com o Xano Developer MCP).
  archive:
    guidance:
      - Confirmar que a implementação corresponde à especificação.